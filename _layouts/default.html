<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>{{ page.title }} | {{ site.title }}</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
    }

    .navbar {
      background-color: #155799;
      padding: 15px;

    }

    .navbar a {
      color: white;

      font-weight: bold;
    }

    .navbar a:hover {

    .content {

      margin: 40px auto;
      padding: 20px;
    }
  </style>

<body>

  <nav class="navbar">
    <a href="{{ '/' | relative_url }}">Home</a>
    <a href="{{ '/about.html' | relative_url }}">About</a>

  </nav>

  <div class="content">
    {{ content }}
  </div>

</html>
